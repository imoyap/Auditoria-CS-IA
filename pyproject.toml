[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditoria-cs"
version = "1.0.0"
description = "Framework modular de auditoría de ciberseguridad"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Auditoria-CS-IA" }]
keywords = ["security", "audit", "cybersecurity", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42.0.0",
    "dnspython>=2.6.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "anthropic>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
api = ["flask>=3.0.0", "requests>=2.31.0"]

[project.scripts]
auditoria = "auditoria.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auditoria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
